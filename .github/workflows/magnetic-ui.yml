name: Magnetic UI (Android APK)

on:
  push:
    paths:
      - "magnetic-ui/**"
      - ".github/workflows/magnetic-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magnetic-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk magnetic-ui.apk

      - uses: actions/upload-artifact@v4
        with:
          name: magnetic-ui-apk
          path: magnetic-ui/magnetic-ui.apk

      # A stable download link that is easy to open straight from the phone.
      - name: Publish "magnetic-ui-latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete magnetic-ui-latest --cleanup-tag --yes || true
          gh release create magnetic-ui-latest magnetic-ui.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Magnetic UI (latest build)" \
            --notes "Debug APK built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}."
